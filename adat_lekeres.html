<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrica adatok</title>
</head>
<body>

    <button id="fetchBtn">Matricák betöltése</button>

    <table border="1" id="vignetteTable" style="margin-top: 20px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Plate Number</th>
                <th>Type</th>
                <th>Category</th>
                <th>Region</th>
                <th>Year</th>
                <th>Valid From</th>
                <th>Valid To</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        document.getElementById('fetchBtn').addEventListener('click', function() {
            fetch('http://localhost:8000/api/vignettes')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector('#vignetteTable tbody');
                    tbody.innerHTML = ''; // Clear previous data

                    data.vignettes.forEach(vignette => {
                        const row = `
                            <tr>
                                <td>${vignette.id}</td>
                                <td>${vignette.vehicle.plate_number}</td>
                                <td>${vignette.type}</td>
                                <td>${vignette.category}</td>
                                <td>${vignette.region || '-'}</td>
                                <td>${vignette.year}</td>
                                <td>${vignette.valid_from}</td>
                                <td>${vignette.valid_to}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>

</body>
</html>
